<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T2 · 订单修改</title>
<link rel="stylesheet" href="/static/style.css">
<style>
body { background:#eef2f7; } .card { padding:18px 22px; border-radius:12px; box-shadow:0 2px 12px rgba(15,23,42,.06); }
.field-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:16px 24px; }
.field { display:flex; flex-direction:column; gap:5px; } .field label { font-size:13px; font-weight:600; color:#1e293b; }
.field .name { font-size:12px; color:#94a3b8; } .field input { width:100%; box-sizing:border-box; }
.choice { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:#475569; }
.action-bar { display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="wrap" style="max-width:960px">
  <div class="nav"><strong style="color:var(--orange)">T2 订单修改</strong><span class="kv" id="who"></span><span class="spacer"></span><a href="/">返回 T 系统</a></div>
  <div id="blocker" class="card hidden" style="border:2px solid var(--red)"><h2 style="color:var(--red)">无法进入修改页</h2><div id="blockerMsg"></div></div>
  <div id="main" class="hidden">
    <div class="card"><h2 id="title">订单</h2><div id="meta" class="kv"></div><p class="kv">修改内容将在提交后同步至 ePortal。</p></div>
    <div class="card"><div id="fields" class="field-grid"></div></div>
    <div class="card"><div class="action-bar"><button id="btnSave" class="btn green">提交</button></div></div>
  </div>
</div>
<script src="/static/common.js"></script>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let orderId = params.get("order_id"), intellisightId = params.get("intellisight_id");
let order = null, changes = {};
function showBlocker(message) { $("blocker").classList.remove("hidden"); $("main").classList.add("hidden"); $("blockerMsg").innerHTML = msgHtml("err", message); }
function fieldHtml(field) {
  const value = field.value == null ? "" : String(field.value), readonly = field.editable === false;
  return `<div class="field"><label>${esc(field.label)} ${readonly ? '<span class="badge off">只读</span>' : ''}</label><span class="name">${esc(field.field_name)}</span><input data-field="${esc(field.field_name)}" value="${esc(value)}" ${readonly ? 'readonly disabled' : ''}><div class="choice hidden" id="choice_${esc(field.field_name)}"></div></div>`;
}
function render() {
  $("main").classList.remove("hidden"); $("title").textContent = `订单 #${order.order_id}　${order.customer_name}`;
  $("meta").innerHTML = `ePortal 表单：${esc(order.form_id || '未返回')}　版本：v${order.version}`;
  $("fields").innerHTML = order.fields.filter(f => f.visible !== false).map(fieldHtml).join("");
  document.querySelectorAll("input[data-field]").forEach(input => input.addEventListener("input", () => {
    const name = input.dataset.field, current = order.fields.find(f => f.field_name === name), choice = $("choice_" + CSS.escape(name));
    if (String(input.value) === String(current.value == null ? "" : current.value)) { delete changes[name]; choice.classList.add("hidden"); return; }
    changes[name] = input.value; choice.classList.remove("hidden");
    choice.innerHTML = `<span>记忆方式：</span><label><input type="radio" name="memory_${esc(name)}" value="permanent" checked>长期</label><label><input type="radio" name="memory_${esc(name)}" value="once">仅本次</label><label><input type="radio" name="memory_${esc(name)}" value="none">不记忆</label>`;
  }));
}
async function load() {
  try { order = await API.fetch(`/api/orders/${orderId}`); await API.fetch(`/api/orders/${orderId}/lock`, {method:"POST", body:"{}"}); $("who").textContent = API.user ? `操作人：${API.user.display_name || API.user.username}` : "操作方式：ePortal 直接访问"; render(); }
  catch (error) { showBlocker(error.message); }
}
async function resolveOrderId() {
  if (orderId) return true;
  if (!intellisightId) return false;
  const resolved = await API.fetch(`/api/orders/lookup?intellisight_id=${encodeURIComponent(intellisightId)}`);
  orderId = String(resolved.order_id);
  return true;
}
$("btnSave").addEventListener("click", async () => {
  const memory_choices = {}; Object.keys(changes).forEach(name => { const selected = document.querySelector(`input[name="memory_${CSS.escape(name)}"]:checked`); if (selected) memory_choices[name] = selected.value; });
  try { const result = await API.fetch(`/api/orders/${orderId}/save`, {method:"POST", body:JSON.stringify({changes, memory_choices, feedback_choices:{}})}); alert(result.status === "synced" ? "提交成功" : "提交失败"); changes = {}; await load(); }
  catch (error) { alert("提交失败"); }
});
if (!orderId && !intellisightId) showBlocker("缺少订单参数，请携带 order_id 或 intellisight_id 进入。");
else resolveOrderId().then(found => { if (found) load(); else showBlocker("缺少有效订单参数"); }).catch(error => showBlocker(error.message));
</script>
</body>
</html>
