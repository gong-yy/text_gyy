<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ePortal（模拟）· 预订单核对</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <div class="nav">
    <strong style="color:var(--green)">ePortal（模拟）</strong>
    <a href="/">记忆库管理</a>
    <a href="/intake">智眸推送演示</a>
    <a href="/eportal" class="active">预订单列表</a>
    <span class="spacer"></span>
    <label class="kv">当前登录业务员（签发 ticket 绑定操作人）：</label>
    <select id="salesSel">
      <option value="sales1|张销售">张销售</option>
      <option value="sales2|李销售">李销售</option>
    </select>
    <button id="btnRefresh" class="btn">刷新</button>
  </div>

  <div class="card" style="border:1px dashed var(--blue)">
    <h2 style="color:var(--blue)">演示工具</h2>
    <div class="toolbar">
      <span class="kv">回写故障注入（模拟 ePortal 更新失败，演示 T 系统自动重试与手动重发）：</span>
      <input id="failTimes" type="number" min="0" value="4" style="width:70px"> 次
      <button id="btnFault" class="btn red small">注入故障</button>
      <button id="btnFaultClear" class="btn gray small">清除故障</button>
      <span id="faultMsg" class="kv"></span>
    </div>
  </div>

  <div id="orders"></div>
  <div id="listMsg"></div>
</div>

<script src="/static/common.js"></script>
<script>
const $ = id => document.getElementById(id);
const OP_LABELS_READ = { text: "文本", date: "日期", boolean: "布尔", select: "下拉" };

async function load() {
  try {
    const rows = await API.fetch("/api/mock/eportal/orders");
    $("orders").innerHTML = rows.length ? rows.map(o => {
      const fields = Object.entries(o.fields || {});
      const items = o.items || [], atts = o.attachments || [];
      return `<div class="order-card" id="card-${esc(o.order_id)}">
        <div class="head">
          <b>${esc(o.order_id)}</b>
          <span>${esc(o.customer_name)}</span>
          ${statusBadge(o.status)}
          <span class="kv">v${o.version}　更新：${esc(o.updated_at || "")}</span>
          <span class="spacer"></span>
          ${o.status === "draft" ? `
            <button class="btn purple" onclick="goT2('${esc(o.order_id)}')">【修改】进 T 系统</button>
            <button class="btn green" onclick="submitOrder('${esc(o.order_id)}')">提交订单</button>` : ""}
        </div>
        <table><thead><tr><th style="width:280px">字段</th><th>当前值</th></tr></thead><tbody>${
          fields.map(([k, meta]) => {
            const m = typeof meta === "object" && meta !== null ? meta : { value: meta };
            const auto = o.auto_modified && o.auto_modified[k];
            return `<tr><td>${esc(k)}
              ${auto ? `<span class="badge memory">由记忆自动修改</span>` : ""}
              ${m.editable === false ? `<span class="badge off">只读 · ePortal 计算</span>` : ""}</td>
              <td class="mono">${esc(m.value == null ? "" : m.value)}</td></tr>`;
          }).join("")}</tbody></table>
        ${items.length ? `<div class="kv mt">产品行 ${items.length} 行（${Object.keys(o.item_schema || {}).filter(c => o.item_schema[c].editable !== false).join("、")} 可编辑）　附件 ${atts.length} 个</div>` : ""}
      </div>`;
    }).join("") : '<div class="card muted">暂无预订单。请先在「智眸推送演示」页推送一张。</div>';
  } catch (e) { $("listMsg").innerHTML = msgHtml("err", e.message); }
}

// 已登录业务员点【修改】：ePortal 签发一次性 ticket（绑定操作人/订单/当前版本）→ 跳转 /t2?ticket=
async function goT2(orderId) {
  try {
    const [user_id, user_name] = document.getElementById("salesSel").value.split("|");
    const res = await API.fetch(`/api/mock/eportal/orders/${orderId}/ticket`, {
      method: "POST", body: JSON.stringify({ user_id, user_name }),
    });
    location.href = `/t2?ticket=${encodeURIComponent(res.ticket)}`;  // URL 只有短时一次性 ticket
  } catch (e) { $("listMsg").innerHTML = msgHtml("err", e.message); }
}

async function submitOrder(orderId) {
  try {
    await API.fetch(`/api/mock/eportal/orders/${orderId}/submit`, { method: "POST", body: "{}" });
    load();
  } catch (e) { $("listMsg").innerHTML = msgHtml("err", e.message); }
}

$("btnRefresh").onclick = load;

// 从 T2 返回：按 #表单ID 定位并高亮该订单
function focusOrder() {
  const id = location.hash.replace("#", "");
  if (!id) return;
  const el = document.getElementById("card-" + id);
  if (el) {
    el.scrollIntoView({ behavior: "smooth", block: "start" });
    el.style.boxShadow = "0 0 0 3px var(--blue)";
    setTimeout(() => { el.style.boxShadow = ""; }, 4000);
  }
}
window.addEventListener("hashchange", focusOrder);
$("btnFault").onclick = async () => {
  const r = await API.fetch("/api/mock/eportal/fault", { method: "POST", body: JSON.stringify({ update_fail_times: parseInt($("failTimes").value || "0") }) });
  $("faultMsg").textContent = `已注入：接下来 ${r.update_fail_times} 次回写将失败`;
};
$("btnFaultClear").onclick = async () => {
  await API.fetch("/api/mock/eportal/fault", { method: "POST", body: JSON.stringify({ update_fail_times: 0 }) });
  $("faultMsg").textContent = "故障已清除";
};

load().then(() => focusOrder());
setInterval(load, 15000);
</script>
</body>
</html>
