; T 系统配置文件（环境变量优先级更高：T_SYSTEM_DB_URL / T_SYSTEM_EPORTAL_MODE 等）
[app]
host = 0.0.0.0
port = 56000

[db]
; 开发/演示默认 SQLite；生产切 MySQL，例：
; url = mysql+pymysql://tuser:tpassword@127.0.0.1:3306/t_system?charset=utf8mb4
; MySQL 建表脚本见 sql/schema.mysql.sql（程序启动也可自动建表）
url = sqlite:///t_system.db

[eportal]
; mock   = 本地模拟 ePortal（内置演示页 /eportal，可演示完整闭环）
; http   = 对接真实 ePortal REST（base_url + 路径 + service_token 按实际契约填写）
mode = mock
base_url = http://127.0.0.1:8400
api_key =
; 仅服务端使用；不要传给浏览器或写入 URL。
service_token =
create_path = /api/orders
update_path = /api/forms/{form_id}
get_path = /api/forms/{form_id}
ticket_exchange_path = /internal/t-system/tickets/exchange
order_for_edit_path = /internal/t-system/orders/{order_id}
order_update_for_edit_path = /internal/t-system/orders/{order_id}
; ticket 有效期（秒），ePortal 侧约定 2~5 分钟；T 编辑会话有效期不高于此值
ticket_ttl_seconds = 300

[agent]
; 内部大模型端点（纠正案例后台学习用）；留空 = 未配置，案例保持 pending，不调度后台处理
; LM Studio REST v1 示例： http://10.106.4.46:1234/api/v1/chat
; endpoint 与 model 同时填写后，将使用 LM Studio 的 model/system_prompt/input 请求格式
endpoint = http://127.0.0.1:1234/api/v1/chat
model = qwen/qwen3.5-35b-a3b
api_key =
timeout_seconds = 60

[auth]
; mock = 本地账号+静态令牌（见 app/seed.py）；sso = 预留对接统一登录
mode = mock

[normalize]
; T1 匹配前的值标准化管线（可配置、可增删步骤）
; trim=去首尾空白  full2half=全角转半角  lower=大小写折叠
; collapse_spaces=去除所有空格  percent_decimal=百分号/小数归一(13% 与 0.13 归一)
steps = trim,full2half,lower,collapse_spaces,percent_decimal

[lock]
; 并发编辑锁 TTL（秒），超时后允许他人接管
ttl_seconds = 300

[writeback]
; 回写 ePortal 失败自动重试次数与退避秒数
max_retries = 3
retry_backoff_seconds = 0.5
